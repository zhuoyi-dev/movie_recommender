<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Movie Recommender</title>
    <style>
        body{
            font-family: Arial;
            background:#f2f2f2;
            text-align:center;
            padding-top:100px;
        }
        input{
            padding:10px;
            width:200px;
            font-size:16px;
        }
        button{
            padding:10px 20px;
            font-size:16px;
            background:#3498db;
            color:white;
            border:none;
            border-radius:5px;
        }
    </style>
</head>
<body>

<h1>🎬 电影推荐系统</h1>

<form action="/recommend" method="post">
    <input type="number" name="user_id" placeholder="输入用户ID 如 1" required>
    <button type="submit">获取推荐</button>
</form>

</body>
</html>
